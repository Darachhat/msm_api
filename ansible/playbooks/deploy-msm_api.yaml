---
- name: Deploy MSM API Service to Docker Swarm
  hosts: swarm_managers
  gather_facts: false
  vars:
    application: msm_api
    deploy_dir: "/var/www/msm/api/{{ application }}"
    # Non-secret values are passed with -e; secrets are read from the environment
    # so they never appear on the command line or in the process list.
    registry_password: "{{ lookup('env', 'GHCR_PULL_TOKEN') }}"
    db_pass: "{{ lookup('env', 'DB_PASS') }}"
    jwt_private_key: "{{ lookup('env', 'JWT_PRIVATE_KEY') }}"
    jwt_public_key: "{{ lookup('env', 'JWT_PUBLIC_KEY') }}"
    r2_access_key_id: "{{ lookup('env', 'R2_ACCESS_KEY_ID') }}"
    r2_secret_access_key: "{{ lookup('env', 'R2_SECRET_ACCESS_KEY') }}"
    white_list_cors: "{{ lookup('env', 'WHITE_LIST_CORS') | default('[\"*\"]', true) }}"

  tasks:
    - name: Ensure deploy directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'
      become: "{{ use_sudo | default(true) | bool }}"

    - name: Ensure deploy directory is owned by the deploy user
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: false
      become: "{{ use_sudo | default(true) | bool }}"

    - name: Ensure logs directory exists (owned by the container user, uid 1000)
      file:
        path: "{{ deploy_dir }}/logs"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'
      become: "{{ use_sudo | default(true) | bool }}"

    - name: Log into container registry
      community.docker.docker_login:
        registry_url: "{{ docker_registry }}"
        username: "{{ registry_user }}"
        password: "{{ registry_password }}"
      no_log: true

    - name: Render Docker Compose file from template
      template:
        src: "{{ playbook_dir | dirname }}/templates/docker-compose-{{ application }}.yml.j2"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: '0600'
      no_log: true

    - name: Deploy/Update Docker stack
      command: >
        docker stack deploy
        --with-registry-auth
        --compose-file {{ deploy_dir }}/docker-compose.yml
        {{ application }}
      register: stack_deploy_result
      changed_when: true

    - name: Wait for service to become healthy
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health_check
      retries: 12
      delay: 10
      until: health_check.status == 200

    - name: Prune old unused images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: true
      when: health_check is succeeded
